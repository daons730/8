<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="브라우저에서 GIF를 편집하고 변환하세요.">
  <title>쓰기 쉬운 GIF 편집기</title>
  <link rel="icon" href="assets/kmou-logo.png">
  <link rel="stylesheet" href="css/shared.css">
  <link rel="stylesheet" href="css/edit.css">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="identity" href="https://www.kmou.ac.kr/" target="_blank" rel="noopener noreferrer" aria-label="국립한국해양대학교">
        <img src="assets/kmou-logo.png" width="44" height="44" alt="">
        <span>국립한국해양대학교<small>KOREA MARITIME &amp; OCEAN UNIVERSITY</small></span>
      </a>
      <nav aria-label="주 메뉴">
        <a class="current" href="index.html" aria-current="page">GIF 편집기</a>
        <a href="maker.html">GIF 만들기</a>
      </nav>
    </div>
  </header>

  <main>
    <section id="home" class="home" aria-labelledby="home-title">
      <div class="hero">
        <h1 id="home-title">쓰기 쉬운 <em>GIF 편집기</em></h1>
        <p>GIF 파일을 간편히 편집하기</p>
      </div>
      <div class="upload-card">
        <div id="dropzone" class="dropzone">
          <div class="file-art" aria-hidden="true">
            <span class="file-back"></span><span class="file-front"><span>GIF</span></span>
            <span class="file-plus">+</span>
          </div>
          <h2>GIF 파일을 여기에 끌어다 놓으세요</h2>
          <p>또는 컴퓨터에서 편집할 파일을 선택하세요.</p>
          <button id="choose" class="primary choose" type="button"><span data-icon="upload" aria-hidden="true"></span>GIF 파일 선택</button>
          <div class="format-note">편집 가능한 형식 <strong>.GIF</strong></div>
          <p id="upload-status" class="upload-status" role="status" hidden></p>
          <input id="file" type="file" accept="image/gif,.gif" hidden>
        </div>
      </div>
    </section>

    <section id="editor" class="editor" aria-label="GIF 편집 작업 공간" hidden>
      <header class="workspace-head">
        <div class="workspace-name">
          <button class="secondary" id="reset" type="button"><span data-icon="back" aria-hidden="true"></span> 새 파일</button>
          <h1 id="filename" tabindex="-1"></h1>
        </div>
        <div class="workspace-actions">
          <button class="secondary history-action" id="undo" type="button" aria-label="실행 취소" title="실행 취소" disabled><span data-icon="undo" aria-hidden="true"></span><span class="history-label">실행 취소</span></button>
          <button class="secondary history-action" id="redo" type="button" aria-label="다시 실행" title="다시 실행" disabled><span data-icon="redo" aria-hidden="true"></span><span class="history-label">다시 실행</span></button>
          <button class="primary" id="save" type="button" disabled><span data-icon="download" aria-hidden="true"></span> 저장</button>
        </div>
      </header>
      <div class="workspace">
        <div class="previews" data-view="original">
          <div class="segmented preview-switch" role="group" aria-label="볼 화면">
            <button type="button" data-view="original" aria-controls="original" aria-pressed="true">원본</button>
            <button type="button" data-view="draft" aria-controls="draft" aria-pressed="false" hidden>미리보기</button>
            <button type="button" data-view="result" aria-controls="result" aria-pressed="false" hidden>결과</button>
          </div>
          <section class="card preview-card draft-card" id="draft" aria-labelledby="draft-title" hidden>
            <header class="card-head"><h2 id="draft-title">편집 미리보기</h2><span class="badge" id="draft-tool"></span></header>
            <div id="draft-body"></div>
            <p id="draft-status" class="draft-status" role="status" hidden></p>
          </section>
          <section class="card preview-card" id="original" aria-labelledby="original-title">
            <header class="card-head">
              <button class="icon-button collapse" id="toggle-original" type="button" aria-label="Original GIF 접기" aria-expanded="true" aria-controls="original-body"><span data-icon="chevron" aria-hidden="true"></span></button>
              <h2 id="original-title">Original GIF</h2>
              <span class="badge">원본</span>
            </header>
            <div id="original-body"></div>
          </section>
          <section class="card preview-card" id="result" aria-labelledby="result-title" hidden>
            <header class="card-head"><h2 id="result-title"></h2><span class="badge">편집 결과</span></header>
            <div id="result-body"></div>
          </section>
        </div>
        <aside class="card tools-card" aria-labelledby="tools-title">
          <header class="card-head"><span class="tools-heading-icon" data-icon="sliders" aria-hidden="true"></span><h2 id="tools-title" tabindex="-1">Editor Tools</h2></header>
          <div id="tools"></div>
          <p id="edit-status" class="edit-status" role="status" hidden></p>
        </aside>
      </div>
    </section>
  </main>

  <footer class="site-footer"><span>GIF 편집기</span><span><span data-icon="shield" aria-hidden="true"></span> 파일은 이 브라우저에서 처리됩니다</span></footer>

  <dialog id="save-dialog" aria-labelledby="save-title">
    <form id="save-form">
      <header class="card-head"><h2 id="save-title">편집한 파일 저장</h2></header>
      <div class="dialog-body">
        <label for="save-name">파일명</label>
        <input id="save-name" type="text" required>
        <p id="save-location"></p>
        <p id="save-status" role="status" hidden></p>
        <div class="action-row"><button id="cancel-save" class="secondary" type="button">취소</button><button id="save-submit" class="primary" type="submit">저장</button></div>
      </div>
    </form>
  </dialog>
  <script type="module" src="js/editor.js"></script>
</body>
</html>
